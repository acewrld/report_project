    <div class="p-5 bg-white">
      <header class="flex justify-between">
        <div>
          <h1 class="text-2xl font-bold mb-2">All Report</h1>
          <p class="text-gray-600 mb-4">Browse and Run all Reports</p>
        </div>
        <div>
          <fa-icon [icon]="faUser" class="text-gray-600 text-xl"></fa-icon>
          <span class="ml-2 text-gray-600">John Doe</span>
          <fa-icon [icon]="faAngleDown" class="text-gray-600 ml-1"></fa-icon>
        </div>
      </header>
      <span class="gap-1.5 relative lg:flex mb-4">
        <input
          type="text"
          placeholder="Search reports..."
          class="border p-2 rounded w-full h-8 mb-4"
        />

        <button
          [matMenuTriggerFor]="menu"
          class="w-full h-8 mb-4 border text-left rounded bg-white flex items-center justify-between px-3"
        >
          {{ selectedCategory || 'All Categories' }} <fa-icon [icon]="faAngleDown"></fa-icon>
        </button>
        <mat-menu
          #menu="matMenu"
          class="grid gap-2 w-fit h-fit absolute left-40 text-xl font-semibold bg-white shadow-lg rounded"
        >
          <a
            class="block p-3 hover:bg-gray-200 {{
              selectedCategory === 'Dashboard' ? 'bg-gray-300' : ''
            }}"
            (click)="selectCategory('Dashboard')"
            >Dashboard</a
          >
          <a
            class="block p-3 hover:bg-gray-200 {{
              selectedCategory === 'Run Report' ? 'bg-gray-300' : ''
            }}"
            (click)="selectCategory('Run Report')"
            >Run Report</a
          >
        </mat-menu>

        <button
          [matMenuTriggerFor]="menuu"
          class="w-full h-8 mb-4 border text-left rounded bg-white flex items-center justify-between px-3"
        >
          {{ selectedSort || 'Sort by: Name:(A - Z)' }} <fa-icon [icon]="faAngleDown"></fa-icon>
        </button>
        <mat-menu
          #menuu="matMenu"
          class="grid gap-2 w-fit h-fit absolute left-40 text-xl font-semibold bg-white shadow-lg rounded"
        >
          <a
            class="block p-3 hover:bg-gray-200 {{
              selectedSort === 'Dashboard' ? 'bg-gray-300' : ''
            }}"
            (click)="selectSort('Dashboard')"
            >Dashboard</a
          >
          <a
            class="block p-3 hover:bg-gray-200 {{
              selectedSort === 'Reports' ? 'bg-gray-300' : ''
            }}"
            (click)="selectSort('Reports')"
            >Run Report</a
          >
        </mat-menu>
      </span>
      <table class="mat-elevation-z8 w-full border-collapse box-border shadow-md overflow-hidden">
        <thead>
          <tr class="border border-b">
            <th class="text-left p-2">Name</th>
            <th class="text-left p-2">Category</th>
            <th class="text-left p-2">Last Run</th>
            <th class="text-left p-2">Status</th>
            <th class="text-left p-2">Date</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let element of datasource" class="hover:bg-gray-100 p-2 box-border">
            <td class="p-2">
              <p>{{ element.name }}</p>
            </td>
            <td class="p-2">
              <p class="border w-20 font-semibold text-center p-1 rounded-md bg-green-200">
                {{ element.category }}
              </p>
            </td>
            <td class="p-2">
              <p>{{ element.lastRun }}</p>
            </td>
            <td class="p-2">
              <p>{{ element.date }}</p>
            </td>
            <td :class="statusClass(element.status)">
              <p>{{ element.status }}</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
