<div class="p-6 bg-linear-to-br from-gray-50 to-gray-100 min-h-screen">
  <header class="flex flex-col lg:flex-row lg:items-center justify-between gap-5 mb-8">
    <div>
      <h1 class="text-3xl font-bold text-slate-800 tracking-tight"> Dashboard </h1>

      <p class="text-sm text-slate-400 mt-0.5">
          Welcome back, 
          <span class="font-bold text-slate-700 pl-3 ">{{ globalState.user }}</span>
        </p></div>
  </header>

  <div class="mt-2 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
    <div
      *ngFor="let card of datasource"
      class="flex flex-col gap-3 rounded-xl bg-slate-50 p-2 border border-slate-100 hover:border-slate-200 hover:bg-slate-100 transition-all duration-200"
    >
      <div class="flex items-center justify-between">
        <span class="text-xs font-medium text-slate-400 uppercase tracking-wide">
          {{ card.title }}
        </span>
        <span
          class="flex h-8 w-8 items-center justify-center rounded-lg"
          [ngClass]="card.label"
        >
          <mat-icon class="text-base leading-none">{{ card.iconUrl }}</mat-icon>
        </span>
      </div>

      <div>
        <p class="text-3xl font-medium text-slate-800 leading-none">
          {{ card.value }}
        </p>
      </div>
    </div>
  </div>

  <div class="mt-6 rounded-xl border border-slate-100 bg-white p-5">
    <div class="flex items-center justify-between mb-5">
      <div class="flex items-center gap-4">
        <h2 class="text-sm font-medium text-slate-700">
          Report submission trends
        </h2>
        <div class="flex items-center gap-1.5 text-xs text-slate-400">
          <span class="inline-block h-2 w-2 rounded-full bg-blue-400"></span>
          Reports submitted
        </div>
      </div>

      <div class="flex gap-1">
      </div>
    </div>
    <app-bar-chart></app-bar-chart>
  </div>
</div>
