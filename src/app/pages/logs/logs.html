<div class="p-6 bg-gray-50">

  <header class="lg:flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6">

    <div>
      <h1 class="text-3xl font-bold text-slate-800">Audit Log</h1>
      <p class="text-gray-500 mt-1">
        Track all user activities and system events
      </p>
    </div>

    <button
      [matMenuTriggerFor]="user"
      class="hidden lg:flex items-center gap-2 px-4 py-2 rounded-xl bg-white border border-gray-200 shadow-sm hover:shadow-md transition-all duration-300"
    >
        <mat-icon class="w-9 h-9 rounded-full bg-amber-100 text-amber-500">account_circle</mat-icon>

      <span class="font-medium text-gray-700">{{ globalState.user }}</span>

      <mat-icon class="text-gray-500 text-sm">
        expand_more
      </mat-icon>

    </button>

    <mat-menu #user="matMenu" class="rounded-2xl overflow-hidden">
      <div class="py-2 min-w-45">
        <a
          class="flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 transition"
          routerLink="/logout"
        >
          <mat-icon class="text-base">logout</mat-icon>
          Logout
        </a>

      </div>
    </mat-menu>

  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

    <div class="relative">
      <input
        type="date"
        (change)="selectDate($event.target.value)"
        class="w-full h-11 rounded-xl border border-gray-200 bg-white px-4 shadow-sm focus:ring-2 focus:ring-amber-300 focus:outline-none"
      />
    </div>


    <button
      [matMenuTriggerFor]="menu"
      class="h-11 rounded-xl border border-gray-200 bg-white px-4 flex items-center justify-between shadow-sm hover:shadow-md transition"
    >

      <span class="text-gray-700">
        {{ selectedAction || 'Actions' }}
      </span>

      <mat-icon class="text-gray-500">
        expand_more
      </mat-icon>

    </button>

    <mat-menu #menu="matMenu" class="rounded-2xl overflow-hidden">
      <div class="py-2 min-w-55">

        <button
          class="w-full text-left px-4 py-3 hover:bg-amber-50 hover:text-amber-600 transition"
          (click)="selectAction('All Actions')"
        >
          All Actions
        </button>

        <button
          class="w-full text-left px-4 py-3 hover:bg-amber-50 hover:text-amber-600 transition"
          (click)="selectAction('Login')"
        >
          Login
        </button>

        <button
          class="w-full text-left px-4 py-3 hover:bg-amber-50 hover:text-amber-600 transition"
          (click)="selectAction('Ran Report')"
        >
          Ran Report
        </button>
        <button
          class="w-full text-left px-4 py-3 hover:bg-amber-50 hover:text-amber-600 transition"
          (click)="selectAction('Update Report')"
        >
          Update Report
        </button>
        <button
          class="w-full text-left px-4 py-3 hover:bg-amber-50 hover:text-amber-600 transition"
          (click)="selectAction('Export Report')"
        >
          Export Report
      </button>

      </div>
    </mat-menu>

    <button
      [matMenuTriggerFor]="meenu"
      class="h-11 rounded-xl border border-gray-200 bg-white px-4 flex items-center justify-between shadow-sm hover:shadow-md transition"
    >

      <span class="text-gray-700">
        {{ selectedStatus || 'Status' }}
      </span>

      <mat-icon class="text-gray-500">
        expand_more
      </mat-icon>

    </button>

    <mat-menu #meenu="matMenu" class="rounded-2xl overflow-hidden">
      <div class="py-2 min-w-55">

        <button
          class="w-full text-left px-4 py-3 hover:bg-amber-50 hover:text-amber-600 transition"
          (click)="selectStatus('All Status')"
        >
          All Status
        </button>

        <button
          class="w-full text-left px-4 py-3 hover:bg-amber-50 hover:text-amber-600 transition"
          (click)="selectStatus('Success')"
        >
          Success
        </button>

        <button
          class="w-full text-left px-4 py-3 hover:bg-amber-50 hover:text-amber-600 transition"
          (click)="selectStatus('Failed')"
        >
          Failed
        </button>

      </div>
    </mat-menu>

    <!-- SEARCH -->
    <div class="relative">
      <input
        type="text"
        [(ngModel)]="searchText"
        (input)="applyFilters()"
        placeholder="Search logs..."
        class="w-full h-11 rounded-xl border border-gray-200 bg-white px-4 pr-11 shadow-sm focus:ring-2 focus:ring-amber-300 focus:outline-none"
      />

      <mat-icon
        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"
      >
        search
      </mat-icon>
    </div>

  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">

    <table class="w-full border-collapse">

      <thead class="bg-gray-100">
        <tr>

          <th class="text-left px-6 py-4 text-sm font-semibold text-gray-600">
            Date & Time
          </th>

          <th class="text-left px-6 py-4 text-sm font-semibold text-gray-600">
            User
          </th>

          <th class="text-left px-6 py-4 text-sm font-semibold text-gray-600">
            Action
          </th>

          <th class="text-left px-6 py-4 text-sm font-semibold text-gray-600">
            Details
          </th>

          <th class="text-left px-6 py-4 text-sm font-semibold text-gray-600">
            Status
          </th>

        </tr>
      </thead>

      <tbody>

        <tr
          *ngFor="let log of datasource"
          class="border-t hover:bg-gray-50 transition duration-200"
        >

          <td class="px-6 py-4 text-gray-700">
            {{ log.dateandtime }}
          </td>

          <td class="px-6 py-4 font-medium text-slate-700">
            {{ log.user }}
          </td>

          <td class="px-6 py-4 text-gray-700">
            {{ log.action }}
          </td>

          <td class="px-6 py-4 text-gray-600">
            {{ log.details }}
          </td>

          <td class="px-3 py-4">

            <span
              [ngClass]="statusClass(log.status)"
              class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
            >
              {{ log.status }}
            </span>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
