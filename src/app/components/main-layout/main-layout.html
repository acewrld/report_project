<mat-sidenav-container class="h-screen">

  </mat-sidenav>

  <mat-sidenav-content class="bg-white">
    <button matButton (click)="toggleSidenav()">
      <mat-icon class="cursor-pointer">menu</mat-icon>
    </button>

    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
