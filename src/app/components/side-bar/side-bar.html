<aside
  class="w-64 h-screen sticky top-0 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shadow-xl"
>
  <div>
    <div class="px-6 py-6 border-b border-slate-800">
      <div class="flex items-center gap-4">

        <div
          class="h-12 w-12 rounded-xl bg-linear-to-br from-amber-400 to-amber-500 flex items-center justify-center shadow-lg"
        >
          <img
            src="assets/signal.png"
            alt="Logo"
            class="h-8 w-8 object-contain"
          >
        </div>

        <div>
          <h2 class="text-lg font-bold text-white tracking-wide">
            Report Portal
          </h2>

          <p class="text-xs text-slate-400">
            Analytics & Reporting
          </p>
        </div>

      </div>
    </div>

    <div class="px-4 pt-6">

      <p
        class="mb-4 px-2 text-xs font-semibold uppercase tracking-widest text-slate-500"
      >
        Navigation
      </p>

      <ul class="space-y-2">

        <li>
          <a
            routerLink="/dashboard"
            routerLinkActive="bg-amber-400 text-slate-900 shadow-md"
            #dashboardLink="routerLinkActive"
            class="group flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 transition-all duration-200 hover:bg-slate-800 hover:text-white"
          >
            <mat-icon>dashboard</mat-icon>

            <span class="font-medium">Dashboard</span>
          </a>
        </li>

        <li>

          <button
            (click)="toggleDept()"
            class="w-full flex items-center justify-between rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition-all duration-200"
          >
            <div class="flex items-center gap-3">
              <mat-icon>apartment</mat-icon>

              <span class="font-medium">
                Departments
              </span>
            </div>

            <mat-icon>
              {{ isDeptOpen ? 'expand_less' : 'expand_more' }}
            </mat-icon>
          </button>

          <div
            *ngIf="isDeptOpen"
            class="ml-5 mt-2 border-l border-slate-700 pl-4"
          >
            <div
              *ngFor="let item of dropdownLink"
              (click)="goToRoute(item.selectItem)"
              class="flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-400 transition-all duration-200 hover:bg-slate-800 hover:text-white"
            >
              <mat-icon class="text-base">
                {{ item.iconUrl }}
              </mat-icon>

              <span>
                {{ item.name }}
              </span>
            </div>
          </div>

        </li>

        <li>
          <a
            routerLink="/audit"
            routerLinkActive="bg-amber-400 text-slate-900 shadow-md"
            class="group flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 transition-all duration-200 hover:bg-slate-800 hover:text-white"
          >
            <mat-icon>history</mat-icon>

            <span class="font-medium">
              Audit Log
            </span>
          </a>
        </li>

      </ul>
    </div>

  </div>

  <div class="border-t border-slate-800 p-4">

    <div
      class="mb-4 rounded-xl border border-slate-700 bg-slate-800 p-4"
    >
      <div class="flex items-center gap-3">

        <div
          class="flex h-10 w-10 items-center justify-center rounded-full bg-amber-400 font-bold text-slate-900"
        >
          {{ globalState.user.charAt(0) }}
        </div>

        <div>
          <p class="text-sm font-semibold text-white">
            {{ globalState.user }}
          </p>
        </div>

      </div>
    </div>

    <a
      routerLink="/"
      class="flex items-center gap-3 rounded-xl px-4 py-3 text-red-400 transition-all duration-200 hover:bg-red-500/10"
    >
      <mat-icon>logout</mat-icon>

      <span class="font-medium">
        Sign Out
      </span>
    </a>

  </div>

</aside>
