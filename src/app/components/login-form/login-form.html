<div class="w-xl h-full mx-auto p-6 sm:p-10 bg-white rounded-2xl shadow-sm text-center flex flex-col justify-center">

  <!-- TITLE -->
  <h2 class="text-2xl sm:text-3xl font-semibold mb-1">
    Welcome Back!
  </h2>

  <p class="text-gray-500 mb-6 text-sm sm:text-base">
    Please sign in to continue
  </p>

  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="space-y-4"
  >

    <!-- EMAIL -->
    <div>
      <input
        type="text"
        placeholder="Username or Email"
        formControlName="email"
        class="w-full px-4 py-3 text-sm sm:text-base border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- PASSWORD -->
    <div>
      <input
        type="password"
        placeholder="Password"
        formControlName="password"
        class="w-full px-4 py-3 text-sm sm:text-base border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- OPTIONS -->
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 text-sm">

      <label class="flex items-center gap-2">
        <input
          type="checkbox"
          formControlName="remember"
          class="accent-blue-600"
        />
        Remember me
      </label>

      <a
        href="#"
        class="text-blue-600 hover:underline text-left sm:text-right"
      >
        Forgot Password?
      </a>

    </div>

    <!-- SUBMIT -->
    <button
      type="submit"
      [disabled]="form.invalid"
      class="w-full py-3 bg-linear-to-r from-blue-600 to-blue-500 text-white rounded-lg font-medium disabled:opacity-50 active:scale-[0.98] transition"
    >
      Sign In
    </button>

  </form>

</div>
