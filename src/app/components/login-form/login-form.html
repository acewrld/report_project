<div class="w-xl p-10 h-screen bg-white rounded-xl shadow-sm text-center flex flex-col justify-center">

  <h2 class="text-2xl font-semibold mb-1">Welcome Back!</h2>
  <p class="text-gray-500 mb-6">Please sign in to continue</p>

  <form class="space-y-4">

    <!-- EMAIL -->
    <div>
      <input
        type="text"
        placeholder="Username or Email"
        formControlName="email"
        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <p
         class="text-red-500 text-sm mt-1 text-left">
        Email is required
      </p>
    </div>

    <!-- PASSWORD -->
    <div>
      <input
        type="password"
        placeholder="Password"
        formControlName="password"
        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <p
         class="text-red-500 text-sm mt-1 text-left">
        Password is required
      </p>
    </div>

    <!-- OPTIONS -->
    <div class="flex justify-between items-center text-sm">
      <label class="flex items-center gap-2">
        <input type="checkbox" formControlName="remember" class="accent-blue-600" />
        Remember me
      </label>

      <a href="#" class="text-blue-600 hover:underline">
        Forgot Password?
      </a>
    </div>

    <!-- SUBMIT -->
    <button
      type="submit"
      class="w-full py-3 bg-linear-to-r from-blue-600 to-blue-500 text-white rounded-lg font-medium disabled:opacity-50"
    >
      Sign In
    </button>

    <!-- DIVIDER -->
    <div class="flex items-center gap-3">
      <div class="flex-1 h-px bg-gray-200"></div>
      <span class="text-gray-400 text-sm">or</span>
      <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <!-- GOOGLE -->
    <button
      type="button"
      class="w-full py-3 border rounded-lg flex items-center justify-center gap-3 hover:bg-gray-50"
    >
      <img src="assets/google.png" class="w-5 h-5" />
      Sign in with Google
    </button>

  </form>
</div>
